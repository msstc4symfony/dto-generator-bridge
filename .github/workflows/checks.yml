name: Code Quality Checks

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v1.9.0
    with:
      slug: msstc4symfony/dto-generator-bridge
      # The bridge runs inside the DTO generator, whose runtime supports PHP 7.4 (runtime profile php74).
      minimal-php: '7.4'
      # Measured MSI 100 % on 2026-10-02 UTC; the bridge keeps every mutant killed.
      infection-min-msi: 100
      infection-min-covered-msi: 100
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
