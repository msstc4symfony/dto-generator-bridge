name: Code Quality Checks

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v1.0.0
    with:
      slug: msstc4symfony/dto-generator-bridge
      # The bridge needs no Symfony at run time: one Symfony line is enough. Its runtime profile php74
      # (composer.json) makes the minimal job run on PHP 7.4.
      symfony-versions: '[{"version":"7.4.*","label":"7.4","codecov":false}]'
      # Measured MSI 100 % on 2026-10-02 UTC; the bridge keeps every mutant killed.
      infection-min-msi: 100
      infection-min-covered-msi: 100
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
