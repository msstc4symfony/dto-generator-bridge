deptrac:
  paths:
    - ./src
  layers:
    # By namespace: deptrac matches a directory pattern anywhere in the absolute path, checkout included.
    - name: Bridge
      collectors:
        - type: classNameRegex
          value: '#^Msstc4Symfony\\DtoGeneratorBridge\\(?!Bundle\\|Runtime\\|((Validator|Serializer)\\)?Json(Value|Scalar)$)#'
    # The Symfony bundle: runs the generator, so it may also use the core's entry points.
    - name: Bundle
      collectors:
        - type: classNameRegex
          value: '#^Msstc4Symfony\\DtoGeneratorBridge\\Bundle\\#'
    # Runs in the application beside symfony/serializer, not in the generator: Symfony only.
    - name: Runtime
      collectors:
        - type: classNameRegex
          value: '#^Msstc4Symfony\\DtoGeneratorBridge\\Runtime\\#'
    # The generator's SPI: what an extension may use of the core.
    - name: CoreSpi
      collectors:
        - type: classNameRegex
          value: '#^MSSTC4PHP\\DtoGenerator\\(Contract|Domain\\(Model|Schema|Diagnostic|Target|Shared))\\#'
    - name: CoreEntry
      collectors:
        - type: classNameRegex
          value: '#^MSSTC4PHP\\DtoGenerator\\(DtoGenerator|Application\\Service\\Generate\\(Input|Mode|Output|Status))$#'
    # PHPStan type aliases imported from the core (JsonValue); deptrac resolves them as if they were classes.
    - name: TypeAlias
      collectors:
        - type: classNameRegex
          value: '#^Msstc4Symfony\\DtoGeneratorBridge\\(Validator\\|Serializer\\)?Json(Value|Scalar)$#'
  ruleset:
    # The generator names the runtime attribute in the code it writes.
    Bridge: [CoreSpi, TypeAlias, Runtime]
    Bundle: [CoreSpi, CoreEntry, Runtime]
    Runtime: ~
    CoreSpi: ~
    CoreEntry: ~
    TypeAlias: ~
