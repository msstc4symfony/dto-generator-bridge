openapi: 3.1.0
info: {title: Bridge matrix, version: '1'}
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 10, pattern: '^[a-z]+$'}
        kind: {type: string, const: pet}
        age: {type: integer, minimum: 0, maximum: 30}
        weight: {type: number, exclusiveMinimum: 0, multipleOf: 0.5}
        tags:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {type: string, maxLength: 4}
        scores:
          type: object
          maxProperties: 2
          additionalProperties: {type: integer, minimum: 0}
        email: {type: string, format: email}
        ip: {type: string, format: ipv4}
        host: {type: string, format: hostname}
        id: {type: string, format: uuid}
        status: {type: string, enum: [active, gone]}
        owner: {$ref: '#/components/schemas/Owner'}
        friends:
          type: array
          items: {$ref: '#/components/schemas/Owner'}
        first_name: {type: string, maxLength: 8}
        born: {type: string, format: date}
        seen: {type: string, format: date-time}
        secret: {type: string, x-serializer-ignore: true}
        note: {type: string, maxLength: 3, x-validator-groups: [strict], x-validator-groups-exclusive: true}
        gone: {type: ['string', 'null'], const: null}
        ip6: {type: string, format: ipv6}
        legs: {type: integer, minimum: 2}
        tail: {type: integer, exclusiveMaximum: 3}
        nick: {type: string, x-serializer-groups: [public]}
        count: {type: integer, format: int32, minimum: 0}
        blob: {type: string, format: byte}
        site: {type: string, format: uri}
        opens: {type: string, format: time}
        tag: {type: string, format: uri, pattern: '^urn:'}
        level: {enum: [low, 1]}
    Owner:
      type: object
      properties:
        name: {type: string, maxLength: 5}
    Den:
      type: object
      properties:
        owner: {$ref: '#/components/schemas/Owner', default: {}}
    Roster:
      type: object
      dependentRequired: {card: [holder]}
      properties:
        card: {type: string}
        holder: {type: string}
        roles: {type: array, items: {type: string}, contains: {const: admin}, maxContains: 1}
        labels: {type: object, additionalProperties: {type: integer}, propertyNames: {maxLength: 3}}
    Parcel:
      type: object
      properties:
        country: {type: string}
        zip: {type: string}
        phone: {type: string, if: {pattern: '^\+'}, then: {minLength: 8}}
        kind: {type: string, enum: [box, letter]}
        weight: {type: integer}
        x-ref: {type: string}
        meta: {type: object, patternProperties: {'^n-': {type: integer}}}
      if: {properties: {country: {const: US}}, required: [country]}
      then: {required: [zip], properties: {zip: {pattern: '^\d{5}$'}}}
      allOf:
        - if: {properties: {kind: {const: letter}}, required: [kind]}
          then: {properties: {weight: {maximum: 50}}}
      patternProperties: {'^x-': {maxLength: 3}}
    Ticket:
      type: object
      properties:
        code: {type: string, not: {enum: [TEST, DEMO]}}
        card: {type: string}
        holder: {type: string}
        voucher: {type: string}
        seat: {type: array, prefixItems: [{type: string, maxLength: 2}, {type: integer, minimum: 1}], unevaluatedItems: false}
        cash: {type: boolean}
        pair: {type: array, x-validator-groups: [api], x-validator-groups-exclusive: true, prefixItems: [{type: string}]}
      not: {required: [card, voucher]}
      dependentSchemas:
        card: {required: [holder]}
        cash: false
    Wallet:
      type: object
      properties:
        card: {type: string}
        holder: {type: string}
      dependentRequired: {card: [holder]}
    Savings:
      allOf:
        - $ref: '#/components/schemas/Wallet'
        - type: object
          properties:
            iban: {type: string}
          if: {required: [iban]}
          then: {required: [holder]}
          patternProperties:
            '^ho': {$ref: '#/components/schemas/Short'}
    Short: {type: string, maxLength: 5}
    Animal:
      oneOf:
        - {$ref: '#/components/schemas/Cat'}
        - {$ref: '#/components/schemas/Dog'}
      discriminator:
        propertyName: animal_type
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
    Cat:
      type: object
      required: [animal_type]
      properties:
        animal_type: {type: string}
        lives: {type: integer, maximum: 9}
    Dog:
      type: object
      required: [animal_type]
      properties:
        animal_type: {type: string}
        good: {type: boolean}
    Tally:
      type: object
      properties:
        label: {type: string}
      additionalProperties: {type: integer, minimum: 0}
    Account:
      type: object
      required: [id, login, password]
      properties:
        id: {type: integer, readOnly: true}
        login: {type: string}
        password: {type: string, writeOnly: true, minLength: 8}
    Shelter:
      type: object
      properties:
        residents:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Owner'}
    Kennel:
      type: object
      properties:
        name: {type: string}
        opened: {type: string, format: date}
      additionalProperties: {$ref: '#/components/schemas/Owner'}
    Creature:
      oneOf:
        - {$ref: '#/components/schemas/Fish'}
        - {$ref: '#/components/schemas/Bird'}
      discriminator:
        propertyName: kind
        mapping:
          fish: '#/components/schemas/Fish'
          bird: '#/components/schemas/Bird'
    CreatureKind: {type: string, enum: [fish, bird]}
    Signal:
      oneOf:
        - {$ref: '#/components/schemas/Ping'}
        - {$ref: '#/components/schemas/Note'}
      discriminator:
        propertyName: kind
        mapping:
          ping: '#/components/schemas/Ping'
        defaultMapping: Note
    Ping:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
    Note:
      type: object
      properties:
        kind: {type: string}
        text: {type: string, maxLength: 5}
    Payment:
      oneOf:
        - {$ref: '#/components/schemas/CardPayment'}
        - {$ref: '#/components/schemas/CashPayment'}
      discriminator:
        propertyName: method
        mapping:
          card: '#/components/schemas/CardPayment'
          cash: '#/components/schemas/CashPayment'
    Charge:
      type: object
      properties:
        amount: {type: integer, minimum: 1}
    CardPayment:
      allOf:
        - {$ref: '#/components/schemas/Charge'}
        - type: object
          required: [method]
          properties:
            method: {type: string, const: card}
            last4: {type: string, pattern: '^[0-9]{4}$'}
    CashPayment:
      type: object
      required: [method]
      properties:
        method: {type: string, const: cash}
    Coupon:
      type: object
      properties:
        code:
          oneOf:
            - {type: string, maxLength: 3}
            - {type: string, pattern: '^[0-9]+$'}
        amount:
          anyOf:
            - {type: string, pattern: '^[0-9]+%$'}
            - {type: integer, minimum: 1}
        limit:
          x-validator-groups: [api]
          anyOf:
            - {type: string, pattern: '^[0-9]+%$'}
            - {type: integer, minimum: 1}
        only:
          x-validator-groups: [api]
          x-validator-groups-exclusive: true
          oneOf:
            - {type: string, maxLength: 3}
            - {type: string, pattern: '^[0-9]+$'}
        codes:
          type: array
          x-validator-groups: [api]
          items:
            oneOf:
              - {type: string, maxLength: 3}
              - {type: string, pattern: '^[0-9]+$'}
    Checkout:
      type: object
      properties:
        payment: {$ref: '#/components/schemas/Payment'}
    Fish:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/CreatureKind'}
        fins: {type: integer, minimum: 0}
    Bird:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/CreatureKind'}
        wings: {type: integer}
